<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Rejoindre une session Planning Poker</title>

    <style>
        body {
            font-family: "Segoe UI", Tahoma, sans-serif;
            background: #f5f6fa;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #2f3640;
        }

        h1 {
            margin-top: 40px;
            color: #273c75;
            font-size: 32px;
        }

        .card {
            background: white;
            margin-top: 25px;
            padding: 25px;
            width: 420px;
            border-radius: 14px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.1);
        }

        label {
            font-size: 16px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            margin-bottom: 18px;
            border: 1px solid #dcdde1;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #00a8ff;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: .2s;
        }

        button:hover {
            background: #0097e6;
        }

        #result {
            margin-top: 20px;
            font-size: 16px;
            color: #44bd32;
            text-align: center;
        }

        a {
            color: #00a8ff;
            font-weight: bold;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<h1>Rejoindre une session</h1>

<div class="card">
    <form id="joinForm">
        <label>Code de la session :</label>
        <input type="text" id="sessionCode" required>

        <label>Votre pseudo :</label>
        <input type="text" id="pseudo" required>

        <button type="submit">Rejoindre</button>
    </form>
</div>

<div id="result"></div>

<script>
    document.getElementById("joinForm").addEventListener("submit", async (e) => {
        e.preventDefault();
        const sessionId = document.getElementById("sessionCode").value;
        const pseudo = document.getElementById("pseudo").value;

        const response = await fetch(`/api/sessions/${sessionId}/join`, {
            method: "POST",
            headers: {"Content-Type":"application/json"},
            body: JSON.stringify({pseudo})
        });

        if (response.ok) {
            document.getElementById("result").innerHTML = `
            <p>Bienvenue <strong>${pseudo}</strong> 🎉</p>
            <a href="game.html?session=${sessionId}&pseudo=${pseudo}">👉 Aller à la session</a>
        `;
        } else {
            document.getElementById("result").style.color = "#e84118";
            document.getElementById("result").innerText = "❌  Erreur : code de session invalide.";
        }
    });
</script>

</body>
</html>
